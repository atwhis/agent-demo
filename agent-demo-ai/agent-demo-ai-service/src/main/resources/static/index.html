<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能问答助手</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SPRING AI LAB</p>
        <h1>智能问答助手</h1>
        <p class="subtitle">查询销售数据，或根据你导入的资料回答问题。</p>
      </div>
      <button id="newConversationButton" type="button" class="secondary">新会话</button>
      <label class="model-picker">
        <span>对话模型</span>
        <select id="modelSelect" aria-label="选择大模型"><option>正在加载…</option></select>
      </label>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant welcome">
        <div class="avatar">AI</div>
        <div class="content">
          <p>你好，我可以查询销售数据，也可以根据你导入的资料回答问题。可以试试：</p>
          <div class="suggestions">
            <button>查询最近一个月购买商品数量最多的客户排行</button>
            <button>查询最近三个月商品分类销售额占比</button>
            <button>最近一个月最受欢迎的具体商品排行</button>
            <button>最近三个月按周统计销售额趋势</button>
          </div>
        </div>
      </article>
    </section>

    <form id="chatForm" class="composer">
      <div id="importFields" class="import-fields" hidden>
        <label>文档标题 <input id="documentTitle" type="text" maxlength="80" disabled></label>
        <label>用途 <select id="documentType" disabled>
          <option value="AUTO">自动识别</option>
          <option>制度规则</option>
          <option>产品说明</option>
          <option>操作指南</option>
          <option>其他</option>
        </select></label>
        <label>选择 TXT <input id="documentFile" type="file" accept=".txt,text/plain" disabled>
          <span id="documentFileSize" hidden></span>
        </label>
        <button id="removeDocumentFile" type="button" class="secondary" hidden>移除文件</button>
      </div>
      <textarea id="promptInput" rows="2" maxlength="4000" placeholder="输入销售数据或资料问题，Enter 发送，Shift + Enter 换行" required></textarea>
      <div class="actions">
        <button id="importButton" type="button" class="secondary">导入文本</button>
        <button id="cancelImportButton" type="button" class="secondary" hidden>取消导入</button>
        <span id="statusText" role="status">就绪</span>
        <button id="stopButton" type="button" class="secondary" disabled>停止</button>
        <button id="sendButton" type="submit" class="primary">发送</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>

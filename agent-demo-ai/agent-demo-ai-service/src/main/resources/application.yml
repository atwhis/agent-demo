spring:
  application:
    name: agent-demo-ai-service
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  http:
    codecs:
      # JSON escaping may expand a 2 MiB text body by up to six times.
      max-in-memory-size: 13MB
  webflux:
    multipart:
      max-parts: 4
      max-in-memory-size: 200KB
      max-disk-usage-per-part: 2MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: AGENT_DEMO
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: AGENT_DEMO
        namespace: ${NACOS_NAMESPACE:}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:nacos:agent-demo-ai-service-${spring.profiles.active:local}.yaml?group=AGENT_DEMO&refreshEnabled=true"
---
spring:
  config:
    activate:
      on-profile: test
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
agent-demo:
  ai:
    models:
      enabled: false

server:
  port: ${SALES_SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${SALES_DATABASE:agent_demo_sales}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:agent_demo}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: always

agent-demo:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

# Local learning switch: DEBUG prints the SQL template and TRACE prints bound
# parameter values. Change both to OFF in shared/test/production data IDs.
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: ${JDBC_SQL_LOG_LEVEL:DEBUG}
    org.springframework.jdbc.core.StatementCreatorUtils: ${JDBC_PARAMETER_LOG_LEVEL:TRACE}
    com.atwhis.agentdemo: INFO

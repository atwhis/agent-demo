server:
  port: ${AI_SERVER_PORT:8082}

agent-demo:
  ai:
    models:
      enabled: ${AI_MODELS_ENABLED:true}
    knowledge:
      enabled: ${AI_KNOWLEDGE_ENABLED:true}
      url: ${KNOWLEDGE_DB_URL:jdbc:postgresql://127.0.0.1:5432/agent_demo_knowledge}
      username: ${KNOWLEDGE_DB_USER:agent_demo}
      password: ${KNOWLEDGE_DB_PASSWORD}
      embedding-directory: classpath:models/embedding
      reranker-directory: classpath:models/reranker
      target-tokens: 320
      max-tokens: 400
      overlap-tokens: 40
      top-k: 15
      top-n: 5
      minimum-logit: -3.0
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-terra}

logging:
  level:
    org.springframework.ai: INFO
    com.atwhis.agentdemo: INFO

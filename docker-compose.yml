name: agent-demo

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.11}
    container_name: agent-demo-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agent_demo_root}
      MYSQL_DATABASE: ${SALES_DATABASE:-agent_demo_sales}
      MYSQL_USER: ${MYSQL_USER:-agent_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent_demo}
      SALES_DATABASE: ${SALES_DATABASE:-agent_demo_sales}
      NACOS_DATABASE: ${NACOS_DATABASE:-nacos_config}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - agent-demo-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - agent-demo-network

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v3.2.3-slim}
    container_name: agent-demo-nacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      FUNCTION_MODE: microservice
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ${NACOS_DATABASE:-nacos_config}
      MYSQL_SERVICE_USER: ${MYSQL_USER:-agent_demo}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-agent_demo}
      MYSQL_DATABASE_NUM: 1
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-agent-demo-server}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-agent-demo-local-development}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
      JVM_XMN: ${NACOS_JVM_XMN:-256m}
    ports:
      - "${NACOS_CONSOLE_PORT:-8080}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - agent-demo-nacos-logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '"data":"ok"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - agent-demo-network

networks:
  agent-demo-network:
    name: agent-demo-network

volumes:
  agent-demo-mysql-data:
    name: agent-demo-mysql-data
  agent-demo-nacos-logs:
    name: agent-demo-nacos-logs
